[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tramcan-rapidocr"
version = "0.2.0"
description = "Isolated CPU evaluation of RapidOCR + PP-OCRv6 on factory scale images."
requires-python = ">=3.11"
dependencies = [
  "rapidocr==3.10.0",
  "onnxruntime==1.31.0",
  "numpy==2.4.6",
  "opencv-python-headless==5.0.0.93",
  "pillow==12.2.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
tramcan-ocr = "tramcan_rapidocr.cli:main"

[project.gui-scripts]
tramcan-ocr-trial = "tramcan_rapidocr.trial_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tramcan_rapidocr = ["model_sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
